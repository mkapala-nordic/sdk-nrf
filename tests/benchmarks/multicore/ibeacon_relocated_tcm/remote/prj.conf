CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_MBOX=y
CONFIG_IPC_SERVICE=y

CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_CTLR_ASSERT_HANDLER=y

CONFIG_ASSERT=y

CONFIG_IPC_RADIO_BT=y
CONFIG_IPC_RADIO_BT_HCI_IPC=y

CONFIG_BT_CTLR_PHY_CODED=n
CONFIG_BT_CENTRAL=n
CONFIG_BT_PERIPHERAL=y

CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n
CONFIG_TIMESLICE_SIZE=0

# When zephyr,code-partition points to SRAM (TCM), FLASH_BASE_ADDRESS should be 0
# because the code partition address is already absolute, not relative to flash base
CONFIG_FLASH_BASE_ADDRESS=0
