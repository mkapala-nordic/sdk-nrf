CONFIG_NCS_SAMPLES_DEFAULTS=n

CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_GPIO=y

CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_ZMS=y

# Disable RRAM throttling (default behavior)
CONFIG_SOC_FLASH_NRF_THROTTLING=n

CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=n
