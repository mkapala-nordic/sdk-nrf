CONFIG_NCS_SAMPLES_DEFAULTS=n

CONFIG_USE_DT_CODE_PARTITION=y

CONFIG_GPIO=y

CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_ZMS=y

# Enable RRAM throttling
CONFIG_SOC_FLASH_NRF_THROTTLING=y
# Data block size in 128-bit words
CONFIG_NRF_RRAM_THROTTLING_DATA_BLOCK=8
# Throttling delay in us (default value)
CONFIG_NRF_RRAM_THROTTLING_DELAY=2000

CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=n
