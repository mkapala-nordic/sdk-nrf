sample:
  name: RRAM radio sync test

tests:
  tests.benchmarks.rram_radio_sync.on:
    platform_allow:
      - nrf54lv10dk/nrf54lv10a/cpuapp
    integration_platforms:
      - nrf54lv10dk/nrf54lv10a/cpuapp
  tests.benchmarks.rram_radio_sync.off:
    platform_allow:
      - nrf54lv10dk/nrf54lv10a/cpuapp/ns
    integration_platforms:
      - nrf54lv10dk/nrf54lv10a/cpuapp/ns
    extra_args:
      - CONFIG_SOC_FLASH_NRF_RADIO_SYNC_NONE=y
