CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_BT=y

# CONFIG_LOG=y
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_PRINTK=n

# Enable MPSL pin debug to toggle GPIOs upon radio events
CONFIG_MPSL_PIN_DEBUG=y
# Use GPIO P1.22 and P1.24 (timestamp2 and timestamp3) for radio events
CONFIG_MPSL_PIN_DEBUG_RADIO_READY_AND_DISABLED_PIN=54
CONFIG_MPSL_PIN_DEBUG_RADIO_ADDRESS_AND_END_PIN=56
